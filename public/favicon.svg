<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18244d" />
      <stop offset="55%" stop-color="#111936" />
      <stop offset="100%" stop-color="#0b1020" />
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.2" r="0.7">
      <stop offset="0%" stop-color="#6ea8fe" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#6ea8fe" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="carBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ea8fe" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#6ea8fe" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background for mobile homescreen masking -->
  <rect width="512" height="512" rx="96" fill="url(#bg)" />
  <rect width="512" height="512" rx="96" fill="url(#glow)" />

  <!-- Subtle road / timetable dashes -->
  <g stroke="#9aa6c4" stroke-opacity="0.28" stroke-width="10" stroke-linecap="round">
    <line x1="92" y1="408" x2="152" y2="408" />
    <line x1="226" y1="408" x2="286" y2="408" />
    <line x1="360" y1="408" x2="420" y2="408" />
  </g>

  <!-- Clock / morning indicator badge (top-right) -->
  <circle cx="384" cy="134" r="46" fill="url(#badge)" />
  <circle cx="384" cy="134" r="36" fill="#0b1020" fill-opacity="0.22" />
  <path
    d="M384 112 v24 l16 10"
    fill="none"
    stroke="#ffffff"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Car silhouette -->
  <g transform="translate(0, 12)">
    <!-- Car cabin -->
    <path
      d="M148 250 L182 184 Q194 164 218 164 L298 164 Q322 164 336 184 L372 250 Z"
      fill="url(#carBody)"
    />
    <!-- Windows -->
    <path
      d="M174 244 L198 194 Q205 182 220 182 L252 182 L252 244 Z"
      fill="#0b1020"
      fill-opacity="0.65"
    />
    <path
      d="M268 244 L268 182 L296 182 Q311 182 319 194 L346 244 Z"
      fill="#0b1020"
      fill-opacity="0.65"
    />

    <!-- Main body -->
    <rect x="86" y="242" width="340" height="92" rx="38" fill="url(#carBody)" />

    <!-- Headlight & taillight -->
    <rect x="394" y="268" width="22" height="22" rx="9" fill="#fde68a" />
    <rect x="96" y="268" width="16" height="22" rx="7" fill="#f87171" />

    <!-- Wheels -->
    <circle cx="168" cy="336" r="42" fill="#0b1020" />
    <circle cx="168" cy="336" r="28" fill="#eef1f8" />
    <circle cx="168" cy="336" r="12" fill="#6ea8fe" />

    <circle cx="344" cy="336" r="42" fill="#0b1020" />
    <circle cx="344" cy="336" r="28" fill="#eef1f8" />
    <circle cx="344" cy="336" r="12" fill="#6ea8fe" />
  </g>
</svg>
